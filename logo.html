<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Euro Gourmet Imports - Official Brand Logo</title>
    <style>
        /* Zero Modifications & Isolated Screen Centering */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1A1D20; /* Charcoal Slate */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .isolated-logo-img {
            width: 80%;
            max-width: 500px;
            height: auto;
            display: block;
            object-fit: contain;
            filter: none !important;
            border: none;
            outline: none;
        }
    </style>
</head>
<body>

    <!-- Direct Isolated Logo Image (Zero Modifications) -->
    <img src="images/22e1d621-3911-4c24-8797-f1a95890f961.png" alt="Euro Gourmet Imports Official Brand Logo" class="isolated-logo-img">

</body>
</html>
